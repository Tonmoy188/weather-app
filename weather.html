<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <link rel="stylesheet" href="weather.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@100..900&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">

</head>

<body>
    <div class="background-effects"></div>

    <div class="container">
        <h1 id="head">Weather App 🌤</h1>
        <div class="search-container">
            <input type="text" id="cityinput" placeholder="Enter city name">
            <button id="searchbtn">Search</button>
        </div>
        <p id="error-msg" class="error">Kehna kya chahte ho???</p>
        <!-- <div id="loading" class="hidden">Loading...</div> -->
        <div id="weather-display" class="weather-info hidden">
            <div class="current-weather">
                <h2 id="location"></h2>
                <p id="date-time"></p>
                <i class="weather-icon fas fa-sun"></i>
                <p id="temperature-label">Temperature</p>
                <p id="description"></p>
            </div>
            <div class="extra-info">
                <div class="weather-box">
                    <i class="fas fa-tint"></i>
                    <h3>Humidity</h3>
                    <p id="humidity"></p>
                </div>
                <div class="weather-box">
                    <i class="fas fa-wind"></i>
                    <h3>Wind Speed</h3>
                    <p id="windspeed"></p>
                </div>

            </div>
        </div>
    </div>

    <script src="weather.js"></script>

</body>

</html>
